<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="相手の石を挟んで反転し、5つ並べる対戦ゲーム。">
  <meta name="theme-color" content="#f9f6ee">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" type="module"></script>
  <title>Gothello</title>
</head>
<body>
  <main>
    <header class="masthead">
      <div>
        <h1>Gothello<span>.</span></h1>
        <p>挟んで返して、5つ並べる。</p>
      </div>
      <button id="open-menu" class="menu-button" type="button" aria-haspopup="dialog" aria-controls="game-menu">
        <span class="menu-icon" aria-hidden="true"></span>メニュー
      </button>
    </header>

    <section class="game" aria-label="対局盤">
      <p id="status" class="status" role="status">対局エンジンを読み込んでいます…</p>
      <div class="board-frame">
        <div class="columns" aria-hidden="true"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span></div>
        <div class="rows" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
        <div id="board" class="board" role="group" aria-label="5 × 5 のマス"></div>
      </div>
      <p id="ai-search" class="ai-search" aria-live="polite" hidden></p>
      <a id="download" class="download" download="gothello.jsonl" hidden>棋譜をダウンロード</a>
    </section>
  </main>

  <dialog id="game-menu" class="game-menu" aria-labelledby="menu-title">
    <div class="menu-panel">
      <header class="menu-header">
        <h2 id="menu-title">対局メニュー</h2>
        <button id="close-menu" class="menu-button" type="button" autofocus>閉じる</button>
      </header>
      <form id="start-form">
        <fieldset id="side-controls" disabled>
          <legend>あなたの手番</legend>
          <label><input type="radio" name="side" value="1" checked><span><i class="stone circle"></i>先攻</span></label>
          <label><input type="radio" name="side" value="2"><span><i class="stone cross"></i>後攻</span></label>
        </fieldset>
        <button id="start" class="primary" type="submit" disabled>対局を始める</button>
      </form>
      <section class="profile">
        <h3>AIの評価設定</h3>
        <p id="profile-name">標準設定</p>
        <label for="profile-file">評価設定ファイル（JSON）</label>
        <input id="profile-file" type="file" accept=".json,application/json" disabled>
        <button id="reset-profile" type="button" disabled>標準に戻す</button>
        <p id="profile-message" role="status" hidden></p>
      </section>
      <section class="rules">
        <h3>遊び方</h3>
        <p>空いているマスに交互に石を置きます。新しい石と自分の石で挟んだ相手の石が反転します。四隅の石は反転しません。縦・横・斜めのいずれかで5つ並べると勝ちです。</p>
      </section>
    </div>
  </dialog>
</body>
</html>
